<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookLoop - Home</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header class="site-header">
    <!-- LOGO: replace with <img> once chosen. Click goes to Home.html -->
    <a class="logo" href="Home.html">BookLoop</a>
    <nav class="main-nav" aria-label="Main menu">
      <a href="Product%20Feature.html">Features</a>
      <a href="Pricing.html">Pricing</a>
      <a href="Team.html">Team</a>
      <a class="btn btn-outline" href="#">Login</a>
    </nav>
  </header>

  <main>
    <!-- HERO: background image goes in CSS (same as Team page) -->
    <section class="hero">
      <h1>BookLoop</h1>
      <p class="tagline">
        <span class="word">Pass it.</span>
        <span class="word">Read it.</span>
        <span class="word">Repeat it.</span>
      </p>
      <form class="search-form" id="search-form" action="#" method="get">
        <label for="book-search">Search for a book</label>
        <input type="search" id="book-search" name="q" placeholder="Search for a book">
        <button class="btn" type="submit">Search</button>
      </form>
      <p class="search-message" id="search-message" role="status"></p>
    </section>
  </main>

  <footer class="site-footer">
    <a class="team-link" href="Team.html">Meet the team</a>
    <p>BookLoop - SEG 2900</p>
  </footer>

</body>
</html>
